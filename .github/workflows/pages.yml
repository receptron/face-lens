name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # postinstall copies the wasm runtimes and fetches MediaPipe's models into apps/demo/public/.
      - run: npm ci
      # The trained models are not in git; the demo loads them from Hugging Face (tag v1).
      - run: npm run build -w apps/demo
        env:
          VITE_MODEL_URL: https://huggingface.co/snakajima/face-lens/resolve/v1/
      - name: Assemble site (landing page at /, demo at /lens/)
        run: |
          mkdir -p _site
          cp pages/index.html _site/
          cp -r apps/demo/dist _site/lens
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
